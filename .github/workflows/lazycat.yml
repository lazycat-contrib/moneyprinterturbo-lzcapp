name: Publish LazyCat LPK

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test concurrent configuration initialization
        run: tests/prepare-config-concurrency.sh
      - name: Check Streamlit WebSocket proxy compatibility
        run: |
          grep -q 'backend: http://webui:8501/' lzc-manifest.yml
          if grep -q 'fix_websocket_header' lzc-manifest.yml; then
            echo 'Streamlit rejects the duplicated Sec-WebSocket-Key header' >&2
            exit 1
          fi

  lazycat:
    needs: runtime-test
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      versioned-release-asset: true
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
