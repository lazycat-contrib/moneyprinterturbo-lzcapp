application:
  subdomain: moneyprinterturbo
  multi_instance: false
  upstreams:
    - location: /api/
      backend: http://api:8080/
    - location: /
      backend: http://webui:8501/
      fix_websocket_header: true
  public_path:
    - /
  injects:
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js

services:
  webui:
    # upstream: ghcr.io/harry0703/moneyprinterturbo:1.3.6
    image: ghcr.1ms.run/harry0703/moneyprinterturbo@sha256:e32a625725eb9bb89640b3573929f7f08792135e4df74fa9597b7ff834c4ad05
    command: /bin/sh /lzcapp/pkg/content/runtime/start-webui.sh
    environment:
      - MPT_BROWSER_SERVER_ADDRESS={{ .S.AppDomain }}
      - MPT_PUBLIC_API_URL=https://{{ .S.AppDomain }}/api
      - {{ printf "MPT_API_KEY=%s" .U.api_key | quote }}
    binds:
      - /lzcapp/var/moneyprinterturbo/storage:/MoneyPrinterTurbo/storage

  api:
    # upstream: ghcr.io/harry0703/moneyprinterturbo:1.3.6
    image: ghcr.1ms.run/harry0703/moneyprinterturbo@sha256:e32a625725eb9bb89640b3573929f7f08792135e4df74fa9597b7ff834c4ad05
    command: /bin/sh /lzcapp/pkg/content/runtime/start-api.sh
    environment:
      - MPT_PUBLIC_API_URL=https://{{ .S.AppDomain }}/api
      - {{ printf "MPT_API_KEY=%s" .U.api_key | quote }}
    binds:
      - /lzcapp/var/moneyprinterturbo/storage:/MoneyPrinterTurbo/storage

usage: |
  Open MoneyPrinterTurbo and configure model-provider keys in the WebUI. The API key is generated by the setup wizard. Configuration and generated videos persist in the application data directory. The WebUI and /api/ route are publicly reachable without LazyCat authentication; do not expose this application domain to an untrusted network.
